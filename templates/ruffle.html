<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta -->
     <style>
    #pvp-notification {
        display: none;
        position: fixed;

        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        z-index: 99999;

        width: 320px;
        padding: 18px;
        

        

        background: linear-gradient(180deg, #2d2a24 0%, #191714 100%);
        border: 2px solid #d5a632;
        border-radius: 12px;

        color: #fff;
        font-family: Arial, sans-serif;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.55),
            inset 0 0 0 1px rgba(255, 255, 255, 0.08);

        animation: pvpSlideIn 0.35s ease-out;
    }

    #pvp-notification-title {
        font-size: 20px;
        font-weight: bold;
        color: #ffd75a;
        margin-bottom: 12px;
        text-shadow: 0 2px 2px #000;
    }

    #pvp-notification-text {
        font-size: 14px;
        line-height: 1.7;
        color: #eeeeee;
    }

    #pvp-notification-text strong {
        color: #ffd75a;
    }

    #pvp-notification-close {
        width: 100%;
        margin-top: 15px;
        padding: 9px 12px;

        border: 1px solid #e5ba48;
        border-radius: 7px;

        background: linear-gradient(180deg, #f1c84c, #c89424);
        color: #201a0f;

        font-size: 14px;
        font-weight: bold;
        cursor: pointer;

        transition: transform 0.15s ease, filter 0.15s ease;
    }

    #pvp-notification-close:hover {
        filter: brightness(1.12);
        transform: translateY(-1px);
    }

    #pvp-notification-close:active {
        transform: translateY(1px);
    }

    @keyframes pvpSlideIn {
        from {
            opacity: 0;
            transform: translateX(40px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
</style>
    <meta charset="utf-8"/>

    <!-- Title and Icon -->
    <title id="pageTitle">Social Empires</title>
    <link rel="shortcut icon" href="/img/icon.gif"/>
    <link rel="icon" type="image/png" href="/img/icon.gif"/>

    <!-- Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle/ruffle.js"></script>
</head>

<body style="font-family: 'lucida grande',tahoma,verdana,arial,sans-serif">

<center>

    <!-- SESSION HEADER -->
    <div id="header" style="width: 760px; margin-top: 50px;">
        <div id="session" style="float: right;">
            <p style="display:inline">
                Logged in as
                <b>{{save_info.name}}</b>
                lvl {{save_info.level}}
                (<a href="/logout">logout</a>)
            </p>
        </div>
    </div>

    <br>

    <!-- GAME BAR -->
    <div id="gameBar" style="margin-top: 15px;">

        <!-- GAME BAR TOP -->
        <div id="gamebar_top" style="width: 760px; height: 90px;">
            <div style="float: left; margin-left:155px; padding: 4px; font-size: 10pt">
                <br><br><br>
                <p style="display: inline">{{ version }}</p>
            </div>
        </div>

        <!-- GAME BAR BUTTONS -->
        <div id="gamebar_buttons" style="width: 760px;">
            &nbsp;

            <a class="gameBarButton" href="#">
                <div><img src="/img/gift.png">Free Gifts</div>
            </a>

            <a class="gameBarButton gameBarButtonSelected" href="#">
                <div>Play</div>
            </a>

            <a class="gameBarButton" href="#">
                <div><img src="/img/cash.png">Get Cash</div>
            </a>

            <a class="gameBarButton"
               href="https://discord.gg/zW5gSbQJBw"
               target="_blank">
                <div><img src="/img/discord.png">Discord</div>
            </a>

            <a class="gameBarButton"
               href="https://github.com/AcidCaos/socialemperors#readme"
               target="_blank">
                <div><img src="/img/github.png">GitHub</div>
            </a>
        </div>

        <style>
            #gameBar {
                text-align: left;
                width: 760px;
                margin-bottom: 0;
                padding: 0;
                background-color: rgb(137, 187, 15);
                background-image: url('/img/Gamebar_byTrevo.png');
                background-repeat: no-repeat;
                background-size: contain;
                border-bottom: solid #6e5335 3px;
            }

            .gameBarButton {
                display: inline-block;
                height: 19px;
                color: black;
                border: solid 1.5px;
                border-color: #9e7747;
                background-color: rgb(255, 245, 131);
                border-top-left-radius: 5px;
                border-top-right-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                font-size: 11pt;
                padding: 2px 3px 1px 3px;
            }

            .gameBarButtonSelected {
                background-color: rgb(233, 221, 81);
            }

            .gameBarButton img {
                height: 17px;
                padding-right: 3px;
                vertical-align: middle;
            }

            .gameBarButton:hover {
                background-color: rgb(250, 237, 90);
                text-decoration: none;
            }

            .gameBarButtonSelected:hover {
                background-color: rgb(223, 212, 82);
            }
        </style>

    </div>

    <!-- RUFFLE GAME -->
    <div id="ruffle"></div>

    <script>
        window.addEventListener("load", async () => {

            const base = window.location.origin;

            console.log("Social Empires server:", base);

            const ruffle = window.RufflePlayer.newest();

            const player = ruffle.createPlayer();

            player.style.width = "760px";
            player.style.height = "600px";
            player.style.backgroundColor = "#669C2C";

            document.getElementById("ruffle").appendChild(player);

            /*
             * IMPORTANT:
             * Use the same origin as this page.
             * Example:
             *
             * http://192.168.8.4:5050
             *
             * This avoids mixing 127.0.0.1 and
             * 192.168.8.4 and therefore avoids CORS problems.
             */

            const gameSWF =
                base +
                "/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}";

            const loaderSWF =
                base +
                "/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf" +
                "?swftoload=" +
                encodeURIComponent(gameSWF);

            const staticURL =
                base +
                "/default01.static.socialpointgames.com/static/socialempires/";

            const dynamicURL =
                base +
                "/dynamic.flash1.dev.socialpoint.es/appsfb/socialempiresdev/srvempires/";

            console.log("Loader SWF:", loaderSWF);
            console.log("Game SWF:", gameSWF);
            console.log("Static URL:", staticURL);
            console.log("Dynamic URL:", dynamicURL);

            const flashVars =
                "spdebug=notnull&brk=0" +
                "&staticUrl=" + encodeURIComponent(staticURL) +
                "&dynamicUrl=" + encodeURIComponent(dynamicURL) +
                "&skiphash12341=notnull&brk=0" +
                "&fb_sig_user={{save_info.userid}}&brk=0" +
                "&user_key=123456789&brk=0" +
                "&language=en&brk=0" +
                "&accessToken=AAABbZAm0wdMUBALsOrR0Ho68CLjaOT8SV3vftKg9mbo1zZColaW5FljRVaLxPGxXXnm1M98mTZCAttcQ4GHwvSyXfsyxYmvKMH8Hmn5iliSPnjvIsZA6&brk=0" +
                "&sex=m&brk=0" +
                "&lastLoggedIn=1349266517&brk=0" +
                "&dailyBonus=0&brk=0" +
                "&friendsInfo=" +
                encodeURIComponent(
                    '[{"first_name":"AcidCaos","uid":"100000","pic_square":"' +
                    base +
                    '/img/profile/x.jpg"}]'
                ) +
                "&brk=0" +
                "&serverTime={{serverTime}}&brk=0" +
                "&forceSyncError=1&brk=0" +
                "&forceAttackReload=0&brk=0" +
                "&forceQuestReload=0&brk=0";

            try {

                await player.load({
                    url: loaderSWF,
                    allowScriptAccess: false,
                    autoplay: "on",
                    parameters: flashVars
                });

                console.log("Ruffle loaded Social Empires.");

            } catch (error) {

                console.error("Ruffle failed:", error);

            }

        });
    </script>
<div id="pvp-notification">
    <div id="pvp-notification-title">
        ⚔ You were attacked!
    </div>

    <div id="pvp-notification-text"></div>

    <button id="pvp-notification-close">
        OK
    </button>
</div>

<script>
    fetch("/api/pvp/unseen")
        .then(response => response.json())
        .then(data => {
            if (data.count > 0) {
                const battle = data.battles[0];

                const box =
                    document.getElementById("pvp-notification");

                const text =
                    document.getElementById("pvp-notification-text");

                text.innerHTML =
                    "<strong>Attacker:</strong> " +
                    (battle.attacker_username || "Unknown player") +
                    "<br>" +

                    "<strong>Result:</strong> " +
                    (battle.win === 1
                        ? "Attacker won"
                        : "Defense successful") +
                    "<br>" +

                    "<strong>Gold:</strong> " +
                    battle.gold +
                    "<br>" +

                    "<strong>XP:</strong> " +
                    battle.xp +
                    "<br>" +

                    "<strong>Honor:</strong> " +
                    battle.honor;

                box.style.display = "block";
            }
        })
        .catch(error => {
            console.error("Failed to load PvP notifications:", error);
        });


    document
        .getElementById("pvp-notification-close")
        .addEventListener("click", function () {

            fetch("/api/pvp/mark-seen", {
                method: "POST"
            })
            .then(response => response.json())
            .then(() => {
                document.getElementById(
                    "pvp-notification"
                ).style.display = "none";
            })
            .catch(error => {
                console.error(
                    "Failed to mark PvP notification as seen:",
                    error
                );
            });

        });
</script>

</body>
</html>
