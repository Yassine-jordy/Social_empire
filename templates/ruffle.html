<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta -->
    <meta charset="utf-8"/>

    <!-- Title and Icon -->
    <title id="pageTitle">Social Empires</title>
    <link rel="shortcut icon" href="/img/icon.gif"/>
    <link rel="icon" type="image/png" href="/img/icon.gif"/>

    <!-- Ruffle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle/ruffle.js"></script>
</head>

<body style="font-family: 'lucida grande',tahoma,verdana,arial,sans-serif">

<center>

    <!-- SESSION HEADER -->
    <div id="header" style="width: 760px; margin-top: 50px;">
        <div id="session" style="float: right;">
            <p style="display:inline">
                Logged in as
                <b>{{save_info.name}}</b>
                lvl {{save_info.level}}
                (<a href="/">logout</a>)
            </p>
        </div>
    </div>

    <br>

    <!-- GAME BAR -->
    <div id="gameBar" style="margin-top: 15px;">

        <!-- GAME BAR TOP -->
        <div id="gamebar_top" style="width: 760px; height: 90px;">
            <div style="float: left; margin-left:155px; padding: 4px; font-size: 10pt">
                <br><br><br>
                <p style="display: inline">{{ version }}</p>
            </div>
        </div>

        <!-- GAME BAR BUTTONS -->
        <div id="gamebar_buttons" style="width: 760px;">
            &nbsp;

            <a class="gameBarButton" href="#">
                <div><img src="/img/gift.png">Free Gifts</div>
            </a>

            <a class="gameBarButton gameBarButtonSelected" href="#">
                <div>Play</div>
            </a>

            <a class="gameBarButton" href="#">
                <div><img src="/img/cash.png">Get Cash</div>
            </a>

            <a class="gameBarButton"
               href="https://discord.gg/zW5gSbQJBw"
               target="_blank">
                <div><img src="/img/discord.png">Discord</div>
            </a>

            <a class="gameBarButton"
               href="https://github.com/AcidCaos/socialemperors#readme"
               target="_blank">
                <div><img src="/img/github.png">GitHub</div>
            </a>
        </div>

        <style>
            #gameBar {
                text-align: left;
                width: 760px;
                margin-bottom: 0;
                padding: 0;
                background-color: rgb(137, 187, 15);
                background-image: url('/img/Gamebar_byTrevo.png');
                background-repeat: no-repeat;
                background-size: contain;
                border-bottom: solid #6e5335 3px;
            }

            .gameBarButton {
                display: inline-block;
                height: 19px;
                color: black;
                border: solid 1.5px;
                border-color: #9e7747;
                background-color: rgb(255, 245, 131);
                border-top-left-radius: 5px;
                border-top-right-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                font-size: 11pt;
                padding: 2px 3px 1px 3px;
            }

            .gameBarButtonSelected {
                background-color: rgb(233, 221, 81);
            }

            .gameBarButton img {
                height: 17px;
                padding-right: 3px;
                vertical-align: middle;
            }

            .gameBarButton:hover {
                background-color: rgb(250, 237, 90);
                text-decoration: none;
            }

            .gameBarButtonSelected:hover {
                background-color: rgb(223, 212, 82);
            }
        </style>

    </div>

    <!-- RUFFLE GAME -->
    <div id="ruffle"></div>

    <script>
        window.addEventListener("load", async () => {

            const base = window.location.origin;

            console.log("Social Empires server:", base);

            const ruffle = window.RufflePlayer.newest();

            const player = ruffle.createPlayer();

            player.style.width = "760px";
            player.style.height = "600px";
            player.style.backgroundColor = "#669C2C";

            document.getElementById("ruffle").appendChild(player);

            /*
             * IMPORTANT:
             * Use the same origin as this page.
             * Example:
             *
             * http://192.168.8.4:5050
             *
             * This avoids mixing 127.0.0.1 and
             * 192.168.8.4 and therefore avoids CORS problems.
             */

            const gameSWF =
                base +
                "/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}";

            const loaderSWF =
                base +
                "/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf" +
                "?swftoload=" +
                encodeURIComponent(gameSWF);

            const staticURL =
                base +
                "/default01.static.socialpointgames.com/static/socialempires/";

            const dynamicURL =
                base +
                "/dynamic.flash1.dev.socialpoint.es/appsfb/socialempiresdev/srvempires/";

            console.log("Loader SWF:", loaderSWF);
            console.log("Game SWF:", gameSWF);
            console.log("Static URL:", staticURL);
            console.log("Dynamic URL:", dynamicURL);

            const flashVars =
                "spdebug=notnull&brk=0" +
                "&staticUrl=" + encodeURIComponent(staticURL) +
                "&dynamicUrl=" + encodeURIComponent(dynamicURL) +
                "&skiphash12341=notnull&brk=0" +
                "&fb_sig_user={{save_info.userid}}&brk=0" +
                "&user_key=123456789&brk=0" +
                "&language=en&brk=0" +
                "&accessToken=AAABbZAm0wdMUBALsOrR0Ho68CLjaOT8SV3vftKg9mbo1zZColaW5FljRVaLxPGxXXnm1M98mTZCAttcQ4GHwvSyXfsyxYmvKMH8Hmn5iliSPnjvIsZA6&brk=0" +
                "&sex=m&brk=0" +
                "&lastLoggedIn=1349266517&brk=0" +
                "&dailyBonus=0&brk=0" +
                "&friendsInfo=" +
                encodeURIComponent(
                    '[{"first_name":"AcidCaos","uid":"100000","pic_square":"' +
                    base +
                    '/img/profile/x.jpg"}]'
                ) +
                "&brk=0" +
                "&serverTime={{serverTime}}&brk=0" +
                "&forceSyncError=1&brk=0" +
                "&forceAttackReload=0&brk=0" +
                "&forceQuestReload=0&brk=0";

            try {

                await player.load({
                    url: loaderSWF,
                    allowScriptAccess: false,
                    autoplay: "on",
                    parameters: flashVars
                });

                console.log("Ruffle loaded Social Empires.");

            } catch (error) {

                console.error("Ruffle failed:", error);

            }

        });
    </script>

</center>

</body>
</html>
