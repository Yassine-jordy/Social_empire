<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social Empires - Create Account</title>

    <link rel="stylesheet" href="/css/account.css">
</head>

<body>

<div class="account-card">

    <img
        class="logo"
        src="/img/logo.png"
        alt="Social Empires"
    >

    <h1>Create Account</h1>

    <div class="subtitle">
        Create your Social Empires account
    </div>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

    <form method="POST">

        <label for="username">Username</label>

        <input
            id="username"
            type="text"
            name="username"
            placeholder="Choose a username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            name="password"
            placeholder="Choose a password"
            autocomplete="new-password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="bottom-link">
        Already have an account?
        <a href="/">Login</a>
    </div>

</div>

</body>
</html>
